name: Create appimage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

    # Checkout the repository
    - name: Checkout main repository
      uses: actions/checkout@v5

    #  Install dependencies
    - name: Install system dependencies & Qt5
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libtool \
          pkg-config \
          qtbase5-dev \
          qttools5-dev-tools \
          libqt5serialport5-dev \
          libzip-dev \
          doxygen \
          graphviz \
          libsigrok-dev \
          libgl1-mesa-dev \
          exuberant-ctags \
          wget

    # Build AppImage
    - name: Generate AppImage
      run: |
        ./create_appimage.sh

    # Upload AppImage as an artifact
    - name: Upload AppImage Artifact
      uses: actions/upload-artifact@v7
      with:
        # Name of the artifact to upload.
        # Optional. Default is 'artifact'
        name: Gede-x86_64.AppImage
        # A file, directory or wildcard pattern that describes what to upload
        # Required.
        path: "Gede*.AppImage"
        if-no-files-found: error
        # Whether to zip the artifact files before upload
        # If 'false', only a single file can be uploaded. The name of the file will be used as the artifact name (the 'name' parameter is ignored)
        # Optional. Default is 'true'
        #archive: false


